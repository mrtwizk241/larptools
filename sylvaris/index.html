<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17161a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Unofficial offline character sheet for the Sylvaris LARP." />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <!-- The header art is the largest paint on every screen; fetch it before the scripts run. -->
    <link
      rel="preload"
      as="image"
      href="./brand/swamp-800.webp"
      imagesrcset="./brand/swamp-800.webp 800w, ./brand/swamp-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>Sylvaris Character Sheet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
